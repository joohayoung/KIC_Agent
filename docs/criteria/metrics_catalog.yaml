# STRIDE 공통 지표 목록 (core/metrics_catalog.yaml)
# 버전: v0.16 (2026-11-10) — 유동성 원천·소요 지표 7개 추가 (S&P Liquidity Descriptors 준용 STRIDE 정의, 원문 403 미확인)
# v0.15 (2026-11-05) — fin.ebitda_interest_coverage EBITDA 음수 시 값 그대로 + note (STRIDE 정의)
# v0.14 (2026-11-05) — fin.ebitda_interest_coverage 이자비용 출처에 금융원가 주석 추가
# v0.13 (2026-11-05) — ovs.available_internal_funds TTM 음수 그대로 사용
# v0.12 (2026-11-05) — fin.short_term_financial_assets 행 없음 처리(fin.net_debt와 같은 규칙), ovs.confirmed·unconfirmed 해외 용도 금액을 정형 칸 기준으로 명시
# v0.11 (2026-11-05) — ovs.confirmed_overseas_funding 조달 확정 근거를 결과 공시 연결로 통일(유상증자·CB·BW), ovs.unconfirmed_overseas_funding 추가
# v0.10 (2026-11-05) — fin.total_borrowings 최신 보고서 리스부채 0 조건·사용권자산 포함 유형자산 태그 신호, fin.ttm_operating_cash_flow 사업연도 값 출력, ovs.confirmed_overseas_funding 유상증자 확정 근거 = 증권발행실적보고서
# v0.9 (2026-11-05) — fin.total_borrowings 리스부채 채택 규칙(BS 행 → 주석 대조, 없으면 리스 주석 값, BS 사용권자산·주석 리스 절 모두 없을 때만 0, 그 외 None), 이중 합산 방지
# v0.8 (2026-11-05) — fin.net_debt A안 확정(현금성자산 = 현금및현금성자산 + 단기금융상품, 한국기업평가 정의), 리스부채 0 처리 폐기(사용권자산 신호 있고 리스부채 행 없으면 missing), 순차입금·총차입금·부채비율에 최신 정기보고서 기준 추가(기준 보고서 선택 규칙), 부채비율 원문 대조 기록
# v0.7 (2026-11-05) — 총차입금에 리스부채 전체 포함(STRIDE 정의, 원문 금융리스부채 포함 병기), fin.net_debt 현금성자산 범위 결정 전까지 methodology '확인 중'
# v0.6 (2026-11-05) — EBITDA를 STRIDE 정의로 전환(감가상각비에 사용권자산 포함, 출처 = 사업보고서 연결 주석·현금흐름표 2출처 대조, 한국기업평가 원문은 사용권자산 언급 없음), EBITDA를 쓰는 비율(순차입금/EBITDA, EBITDA 마진) methodology 정정
# v0.5 (2026-11-04) — 1단계 API 확인 반영: 단기금융상품·총차입금·EBITDA·EBITDA/이자비용 산식을 account_id 허용목록으로 확정, 감사의견 값을 응답 문자열 그대로로
# v0.4 (2026-11-04) — 확인되지 않은 정보 제거: 모든 band를 null로(구간 표시 Phase 2), 재무 지표를 한국기업평가
#        「주요 재무지표의 정의」(원문 확인)로 교체·기간을 사업연도별로, 3년 평균·Altman Z·band_methodology 삭제, fin.equity_ex_nci 추가
# v0.3 (2026-11-04) / v0.2 (2026-11-03) / v0.1 (2026-11-03) — 이전 버전은 _이전버전/
#
# 규칙 (stride-agent-dev-standard 3-1장)
# - 모든 Metric.metric_id 와 Classification.key 는 이 목록에 있는 것만 쓴다.
# - 이미 있는 지표는 implementation 함수를 호출한다. 계산식을 복사하지 않는다.
# - 정의 변경은 owner 에이전트만 한다. 바꾸면 used_by 에이전트 테스트를 모두 다시 돌린다.
# - status: draft(설계만 됨) / confirmed(실제 데이터로 검증 완료)
# - methodology에는 원문으로 확인한 출처만 쓴다. 원문이 없으면 "STRIDE 정의: <산식>".
#
# 에이전트 약어: ovs = overseas_funding, fin = financial_health

- metric_id: fin.cash_and_equivalents
  kind: metric
  name: 현금및현금성자산
  unit: 원
  period: as_of 이전 접수된 최신 정기보고서의 기말 잔액
  formula: 재무상태표 현금및현금성자산 (연결 우선, 없으면 별도)
  methodology: K-IFRS 재무상태표 계정 (account_id ifrs-full_CashAndCashEquivalents)
  source: DART 단일회사 전체 재무제표 (fnlttSinglAcntAll)
  band: null
  owner: financial_health
  used_by:
  - overseas_funding
  implementation: core.calc.fin_items.cash_and_equivalents
  status: draft
- metric_id: fin.short_term_financial_assets
  kind: metric
  name: 단기금융상품
  unit: 원
  period: as_of 이전 접수된 최신 정기보고서의 기말 잔액
  formula: 재무상태표(BS) account_id ifrs-full_ShorttermDepositsNotClassifiedAsCashEquivalents (연결 우선, 없으면 별도). 그 행이 없고 ifrs-full_OtherCurrentFinancialAssets 행도 없으면 0, ifrs-full_OtherCurrentFinancialAssets 행만 있으면 None
  methodology: K-IFRS 재무상태표 계정 (account_id ifrs-full_ShorttermDepositsNotClassifiedAsCashEquivalents)
  source: DART 단일회사 전체 재무제표 (fnlttSinglAcntAll)
  band: null
  owner: financial_health
  used_by:
  - overseas_funding
  implementation: core.calc.fin_items.short_term_financial_assets
  status: draft
- metric_id: fin.ttm_operating_cash_flow
  kind: metric
  name: 최근 4분기 영업활동현금흐름
  unit: 원
  period: TTM (as_of 이전 접수된 최신 정기보고서 기준) + 사업연도별 (사업보고서 연간값, period {YYYY}FY) — 재무 건전성 개발문서 3.1
  formula: 당기 누적 + 직전 사업연도 연간 - 전기 동기 누적 (사업보고서는 연간값 그대로)
  methodology: K-IFRS 현금흐름표 영업활동현금흐름, 분기 누적값 차감 방식
  source: DART 단일회사 전체 재무제표 (fnlttSinglAcntAll)
  band: null
  owner: financial_health
  used_by:
  - overseas_funding
  implementation: core.calc.cashflow.ttm_operating_cash_flow
  status: draft
- metric_id: ovs.overseas_investment_amount
  kind: metric
  name: 대표 프로젝트 해외 투자액
  unit: 원
  period: as_of 기준
  formula: '대표 금액 우선순위 — 주요사항보고서(취득·양수) 금액 > 조달 공시의 해외 용도 금액 > 정기보고서 계획 금액 > 기사 금액. 첫 번째로 값이 있는 것.

    '
  methodology: STRIDE 정의 (출처 등급 A > C 우선, 개발문서 7.8)
  source: DART 주요사항보고서(DS005), DART 정기보고서 원문, 뉴스
  band: null
  owner: overseas_funding
  used_by: []
  implementation: agents.overseas_funding.calc.funding.investment_amount
  status: draft
- metric_id: ovs.confirmed_overseas_funding
  kind: metric
  name: 확정 조달액 (해외 용도)
  unit: 원
  period: as_of 기준
  formula: '대표 프로젝트에 묶인 유상증자·CB·BW 결정 공시 중 결과 공시(증권발행실적보고서 또는 거래소 발행결과)가 같은 회사·같은 증권 종류·금액 일치로 연결되고 결과 공시 납입일이 재무 기준일 이후인 건의 해외 용도 금액 합. 해외 용도 금액 = 자금 사용 목적 칸(fdpp_*) 중 해외로 분류된 칸의 합이며 LLM 금액은 쓰지 않는다. 결정 공시 납입일은 예정일로 note에만 기록 (재무제표 현금과 중복 방지, 개발문서 11.2).

    '
  methodology: STRIDE 정의 (개발문서 11.2)
  source: DART 주요사항보고서 (piicDecsn, cvbdIsDecsn, bdwtIsDecsn), 증권발행실적보고서 (pblntf_ty=C), 거래소 발행결과 공시 (pblntf_ty=I), document.xml
  band: null
  owner: overseas_funding
  used_by: []
  implementation: agents.overseas_funding.calc.funding.confirmed_funding
  status: draft
- metric_id: ovs.unconfirmed_overseas_funding
  kind: metric
  name: 미확정 조달액 (해외 용도)
  unit: 원
  period: as_of 기준
  formula: '대표 프로젝트에 묶인 유상증자·CB·BW 결정 공시 중 결과 공시가 없거나 연결이 모호·금액 불일치인 건의 해외 용도 금액 합. ovs.available_internal_funds와 ovs.funding_gap 계산에 넣지 않는다 (개발문서 11.2).

    '
  methodology: STRIDE 정의 (개발문서 11.2)
  source: DART 주요사항보고서 (piicDecsn, cvbdIsDecsn, bdwtIsDecsn), 증권발행실적보고서, 거래소 발행결과 공시
  band: null
  owner: overseas_funding
  used_by: []
  implementation: agents.overseas_funding.calc.funding.unconfirmed_funding
  status: draft
- metric_id: ovs.available_internal_funds
  kind: metric
  name: 가용 자금
  unit: 원
  period: as_of 기준
  formula: 'fin.cash_and_equivalents + fin.short_term_financial_assets + fin.ttm_operating_cash_flow (음수 그대로) + ovs.confirmed_overseas_funding

    '
  methodology: '자금조달 우선순위 이론에 따라 내부 자금을 먼저 차감 (Myers & Majluf 1984; Shyam-Sunder & Myers 1999). 음수 TTM 영업현금흐름을 그대로 더하는 것은 STRIDE 정의

    '
  source: 위 구성 지표
  band: null
  owner: overseas_funding
  used_by: []
  implementation: agents.overseas_funding.calc.funding.available_funds
  status: draft
- metric_id: ovs.funding_gap
  kind: metric
  name: 자금 공백
  unit: 원
  period: as_of 기준
  formula: ovs.overseas_investment_amount - ovs.available_internal_funds (양수 = 부족)
  methodology: '외부자금 의존도 개념(설비투자 - 영업현금흐름)을 프로젝트 1건 단위로 적용 (Rajan & Zingales 1998). 원 논문은 산업 단위 장기 합계라는 차이가 있음.

    '
  source: 위 구성 지표
  band: null
  owner: overseas_funding
  used_by: []
  implementation: agents.overseas_funding.calc.funding.funding_gap
  status: draft
- metric_id: ovs.funding_gap_ratio
  kind: metric
  name: 자금 공백 비율
  unit: 비율
  period: as_of 기준
  formula: ovs.funding_gap / ovs.overseas_investment_amount
  methodology: Rajan & Zingales (1998) 외부자금 의존도 비율 형식의 프로젝트 단위 적용
  source: 위 구성 지표
  band: null
  owner: overseas_funding
  used_by: []
  implementation: agents.overseas_funding.calc.funding.funding_gap_ratio
  status: draft
- metric_id: ovs.overseas_investment_within_24m
  kind: metric
  name: 24개월 내 해외 투자액
  unit: 원
  period: as_of 기준 (as_of ~ as_of+24개월)
  formula: 대표 프로젝트 투자액(ovs.overseas_investment_amount에 들어간 건) 중 집행일(재무 기준일 이후 확정일, 없으면 취득·송금 예정일)이 as_of+24개월 이하인 건의 합. 날짜가 없는 건은 포함하고 note '예정일 없음'
  methodology: 'S&P Liquidity Descriptors for Global Corporate Issuers(2014)·관련 가이드(2019) 준용, STRIDE 정의. 원문 PDF는 내려받기 실패(HTTP 403, 2026-11-10)로 문단 번호 미확인 — 원문 확인 전까지 S&P 기준값·구간을 쓰지 않는다. 차이: 은행 약정 한도·회사 전망치 미포함, 영업현금흐름은 TTM 실적'
  source: DART 주요사항보고서(DS005), 정정 공시, 정기보고서 원문
  band: null
  owner: overseas_funding
  used_by: []
  implementation: agents.overseas_funding.calc.funding.investment_within_24m
  status: draft
- metric_id: ovs.overseas_investment_beyond_24m
  kind: metric
  name: 24개월 밖 해외 투자액
  unit: 원
  period: as_of 기준 (as_of+24개월 이후)
  formula: 대표 프로젝트 투자액 중 집행일이 as_of+24개월 뒤인 건의 합. 유동성 소요에 넣지 않는다
  methodology: 'S&P Liquidity Descriptors for Global Corporate Issuers(2014)·관련 가이드(2019) 준용, STRIDE 정의. 원문 PDF는 내려받기 실패(HTTP 403, 2026-11-10)로 문단 번호 미확인 — 원문 확인 전까지 S&P 기준값·구간을 쓰지 않는다. 차이: 은행 약정 한도·회사 전망치 미포함, 영업현금흐름은 TTM 실적'
  source: DART 주요사항보고서(DS005), 정정 공시
  band: null
  owner: overseas_funding
  used_by: []
  implementation: agents.overseas_funding.calc.funding.investment_beyond_24m
  status: draft
- metric_id: fin.maturing_debt_1y
  kind: metric
  name: 1년 내 만기 차입금
  unit: 원
  period: as_of 이전 접수된 최신 정기보고서의 기말 잔액
  formula: 재무상태표 유동 차입 계정(단기차입금·유동성장기차입금·유동성사채·유동성전환사채 등, core.calc.fin_items.CURRENT_DEBT_IDS) + 유동부채 절 안의 표준계정코드 미사용 차입·사채 행(이름 규칙). 리스부채 제외. 분류 안 되는 차입 행·빈 금액이 있으면 None, 행이 없으면 0
  methodology: 'S&P Liquidity Descriptors for Global Corporate Issuers(2014)·관련 가이드(2019) 준용, STRIDE 정의. 원문 PDF는 내려받기 실패(HTTP 403, 2026-11-10)로 문단 번호 미확인 — 원문 확인 전까지 S&P 기준값·구간을 쓰지 않는다. 차이: 은행 약정 한도·회사 전망치 미포함, 영업현금흐름은 TTM 실적. 유동 분류는 K-IFRS 재무상태표 유동부채 구분을 따른다'
  source: DART 단일회사 전체 재무제표 (fnlttSinglAcntAll)
  band: null
  owner: financial_health
  used_by:
  - overseas_funding
  implementation: core.calc.fin_items.maturing_debt_1y
  status: draft
- metric_id: fin.dividends_paid_last_fy
  kind: metric
  name: 직전 사업연도 배당금 지급액
  unit: 원
  period: as_of 이전 접수된 최신 사업보고서의 사업연도
  formula: 현금흐름표 배당금 지급 행(core.calc.fin_items.DIVIDEND_PAID_IDS, 없으면 표준계정코드 미사용 '배당금(의)지급' 행)의 절댓값 (연결 우선). 배당금 수취 행·신종자본증권 배당은 제외. 행이 없으면 0 (note '배당 지급 행 없음'), 여러 행이면 None
  methodology: 'S&P Liquidity Descriptors for Global Corporate Issuers(2014)·관련 가이드(2019) 준용, STRIDE 정의. 원문 PDF는 내려받기 실패(HTTP 403, 2026-11-10)로 문단 번호 미확인 — 원문 확인 전까지 S&P 기준값·구간을 쓰지 않는다. 차이: 은행 약정 한도·회사 전망치 미포함, 영업현금흐름은 TTM 실적'
  source: DART 단일회사 전체 재무제표 (fnlttSinglAcntAll), 사업보고서
  band: null
  owner: financial_health
  used_by:
  - overseas_funding
  implementation: core.calc.fin_items.dividends_paid_last_fy
  status: draft
- metric_id: ovs.liquidity_uses
  kind: metric
  name: 유동성 소요
  unit: 원
  period: as_of 기준
  formula: ovs.overseas_investment_within_24m + fin.maturing_debt_1y + fin.dividends_paid_last_fy. 하나라도 없으면 None
  methodology: 'S&P Liquidity Descriptors for Global Corporate Issuers(2014)·관련 가이드(2019) 준용, STRIDE 정의. 원문 PDF는 내려받기 실패(HTTP 403, 2026-11-10)로 문단 번호 미확인 — 원문 확인 전까지 S&P 기준값·구간을 쓰지 않는다. 차이: 은행 약정 한도·회사 전망치 미포함, 영업현금흐름은 TTM 실적'
  source: 위 구성 지표
  band: null
  owner: overseas_funding
  used_by: []
  implementation: agents.overseas_funding.calc.funding.liquidity_uses
  status: draft
- metric_id: ovs.liquidity_surplus
