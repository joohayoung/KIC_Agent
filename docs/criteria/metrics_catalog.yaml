- metric_id: fin.ebitda
  kind: metric
  name: EBITDA
  unit: 원
  period: 사업연도별 (as_of 이전 접수된 사업보고서)
  formula: 영업이익(IS/CIS dart_OperatingIncomeLoss) + 감가상각비(사용권자산 감가상각 포함) + 무형자산상각비. 상각비는 사업보고서 연결 주석 '비용의 성격별 분류'(N)와 '영업에서 창출된 현금' 조정 내역 또는 연결현금흐름표 본문(C)을 대조해 채택 (재무 건전성 개발문서 9.1·12장). 사용권자산상각비가 C에 따로 있으면 더하고 이미 포함돼 있으면 그대로. 무형자산상각비 행이 없으면 BS 무형자산 행이 없거나 0일 때 0, 있으면 None(note '무형자산상각비 미공시'). 출처 불일치·비원화는 None
  methodology: 'STRIDE 정의: 영업이익 + 감가상각비(사용권자산 감가상각 포함) + 무형자산상각비. 참고: 한국기업평가 「주요 재무지표의 정의」 EBITDA = EBIT+감가상각비+무형자산상각비, EBIT = 매출액-매출원가-판관비 (사용권자산 언급 없음, 2026-11-05 원문 확인)'
  source: DART document.xml (사업보고서 연결 주석·연결현금흐름표), fnlttSinglAcntAll (영업이익, 재무상태표 무형자산)
  band: null
  owner: financial_health
  used_by: []
  implementation: core.calc.fin_items.ebitda
  status: draft
- metric_id: fin.total_borrowings
  kind: metric
  name: 총차입금
  unit: 원
  period: 사업연도별 (사업보고서) + 최신 정기보고서(분기·반기) 기준일 — 기준 보고서 선택 규칙은 재무 건전성 개발문서 3.1
  formula: '재무상태표(BS) 차입금·사채 허용목록 account_id 행의 합 + 유동·비유동 리스부채. 차입·사채·리스부채 계열 행 중 허용목록 밖 행이 있거나 금액이 비면 None. 리스부채 채택 규칙(재무 건전성 개발문서 9.1): BS 리스부채 행이 있으면 BS 값을 쓰고 같은 보고서 리스 주석 값과 대조해 불일치(표 단위 1 초과)·대조 불가면 None. BS 행이 없으면 같은 보고서 연결 주석의 리스부채 잔액(유동+비유동, 없으면 합계)을 쓰고 note 리스부채 출처: 리스 주석. BS 사용권자산 신호(ifrs-full_RightofuseAssets 금액 > 0 또는 ifrs-full_PropertyPlantAndEquipmentIncludingRightofuseAssets 행) 없음 + 주석 리스 절 없음 + 주석 리스부채 값 없음일 때만 리스부채 0. 반기·분기보고서는 직전 사업보고서에도 리스부채가 없어야 하며, 아니면 None (note 최신 보고서 리스부채 미공시, 직전 사업보고서 금액을 섞지 않음). 그 외 None (note 리스부채 확인 불가). 이중 합산 방지: 총차입금에 넣는 차입·사채 행 이름에 리스가 있거나 주석 리스부채 표가 그 행의 구성 표이면 None'
  methodology: 'STRIDE 정의: 재무상태표 차입금·사채 허용목록 계정 + 유동·비유동 리스부채 전체. 참고: 한국기업평가 「주요 재무지표의 정의」는 차입금 구성에 금융리스부채·유동성금융리스미지급금을 포함(K-IFRS 1116 이전 용어, 2026-11-05 원문 확인)'
  source: DART fnlttSinglAcntAll (재무상태표), document.xml (같은 보고서 연결 주석 리스부채)
  band: null
  owner: financial_health
  used_by: []
  implementation: core.calc.fin_items.total_borrowings
  status: draft
- metric_id: fin.market_cap
  kind: metric
  name: 시가총액
  unit: 원
  period: as_of 기준일 (휴장일이면 직전 거래일)
  formula: 기준일 종가 × 상장주식수 (API 제공값 우선)
  methodology: 거래소 시가총액
  source: KRX OPEN API 우선, 미승인 시 공공데이터포털 금융위원회_주식시세정보
  band: null
  owner: financial_health
  used_by: []
  implementation: core.calc.market.market_cap
  status: draft
- metric_id: fin.net_debt
  kind: metric
  name: 순차입금
  unit: 원
  period: 사업연도별 (사업보고서) + 최신 정기보고서(분기·반기) 기준일 — 기준 보고서 선택 규칙은 재무 건전성 개발문서 3.1
  formula: 'fin.total_borrowings - (현금및현금성자산 + 단기금융상품). 단기금융상품 = BS ifrs-full_ShorttermDepositsNotClassifiedAsCashEquivalents. 그 행이 없고 ifrs-full_OtherCurrentFinancialAssets도 없으면 0, ifrs-full_OtherCurrentFinancialAssets만 있으면 None. 같은 기준 보고서의 BS 값끼리 계산'
  methodology: '한국기업평가 「주요 재무지표의 정의」 (2026-11-05 원문 확인): 순차입금 = 총차입금-현금성자산, 현금성자산 = 현금및현금등가물+단기금융상품 등. 총차입금의 리스부채 포함 부분은 STRIDE 정의 (fin.total_borrowings)'
  source: DART fnlttSinglAcntAll (재무상태표)
  band: null
  owner: financial_health
  used_by: []
  implementation: core.calc.fin_items.net_debt
  status: draft
- metric_id: fin.net_debt_to_ebitda
  kind: metric
  name: 순차입금/EBITDA
  unit: 배
  period: 사업연도별
  formula: fin.net_debt / fin.ebitda (같은 사업연도. EBITDA ≤ 0이면 None)
  methodology: 'STRIDE 정의: fin.net_debt / fin.ebitda (EBITDA는 STRIDE 정의)'
  source: 위 구성 지표
  band: null
  owner: financial_health
  used_by: []
  implementation: core.calc.ratios.net_debt_to_ebitda
  status: draft
- metric_id: fin.ebitda_interest_coverage
  kind: metric
  name: EBITDA/이자비용
  unit: 배
  period: 사업연도별
  formula: fin.ebitda / 이자비용. 이자비용 = CF dart_AdjustmentsForInterestExpenses, 없으면 연결 주석 금융원가 표 등 2개 표 이상에서 값이 같은 이자비용 행 (재무 건전성 개발문서 9.1a). 금융비용 합계로 대체하지 않음
  methodology: 'STRIDE 정의: EBITDA/이자비용. 한국기업평가 EBITDA/금융비용과 분모가 다름(note 출력). EBITDA 음수면 값 그대로 출력하고 note EBITDA 음수'
  source: 위 구성 지표
  band: null
  owner: financial_health
  used_by: []
  implementation: core.calc.ratios.ebitda_interest_coverage
  status: draft
- metric_id: fin.ebitda_margin
  kind: metric
  name: EBITDA 마진
  unit: '%'
  period: 사업연도별
  formula: fin.ebitda / 매출액 × 100
  methodology: 'STRIDE 정의: fin.ebitda / 매출액 × 100 (EBITDA는 STRIDE 정의. 산식 형태는 한국기업평가 EBITDA MARGIN과 같음)'
  source: 위 구성 지표
  band: null
  owner: financial_health
  used_by: []
  implementation: core.calc.ratios.ebitda_margin
  status: draft
- metric_id: fin.capital_impairment_ratio
  kind: metric
  name: 자본잠식률
  unit: '%'
  period: 최근 사업연도말 (반기 기준은 별도 표시)
  formula: (자본금 - 자기자본) / 자본금 × 100. 연결 기준이면 자기자본은 비지배지분 제외
  methodology: 한국거래소 KIND 유가증권시장·코스닥시장 공시가이드(2026.2.2) 산식 (2026-11-04 원문 확인)
  source: DART fnlttSinglAcntAll (재무상태표)
  band: null
  owner: financial_health
  used_by:
  - orchestrator
  implementation: core.calc.ratios.capital_impairment_ratio
  status: draft
- metric_id: fin.equity_ex_nci
  kind: metric
  name: 자기자본 (비지배지분 제외)
  unit: 원
  period: 최근 사업연도말
  formula: '연결: 지배기업 소유주지분, 별도: 자본총계'
  methodology: 한국거래소 KIND 코스닥시장 공시가이드(2026.2.2) 자기자본 기준의 입력 (2026-11-04 원문 확인)
  source: DART fnlttSinglAcntAll (재무상태표)
  band: null
  owner: financial_health
  used_by:
  - orchestrator
  implementation: core.calc.fin_items.equity_ex_nci
  status: draft
- metric_id: fin.debt_ratio
  kind: metric
  name: 부채비율
  unit: '%'
  period: 최근 3개 사업연도 (사업보고서) + 최신 정기보고서(분기·반기) 기준일
  formula: 'BS ifrs-full_Liabilities / ifrs-full_Equity × 100. 자본총계 ≤ 0이면 None (note 자본총계 ≤ 0)'
  methodology: '한국기업평가 「주요 재무지표의 정의」 부채비율 = (부채총계/자본총계)*100 (2026-11-05 원문 재확인)'
  source: DART fnlttSinglAcntAll
